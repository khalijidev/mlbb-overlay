<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road to Immortal – Overlay MLBB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@600;800&family=Poppins:wght@600;800&family=Rajdhani:wght@600;700&display=swap">
<style>
:root{--ink:#0f0d22;--panel:#1d1a3d;--line:#3a3570;--text:#f3f0ff;--muted:#a49fd0;--win:#4ade80;--lose:#ff5d73;--ok:#4fe0ff;font-family:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text)}
body.dash{background:var(--ink);padding:16px}
.card{width:460px;max-width:100%;background:var(--bg);color:var(--ct);border:2px solid var(--bd);border-radius:var(--r);padding:16px 18px 14px;position:relative;overflow:hidden;font-family:var(--font)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--tier)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--mu)}.title{font-weight:700;font-size:15px;letter-spacing:.04em}
.rank{display:flex;align-items:baseline;gap:12px;margin:6px 0 12px}.rank .name{font-size:40px;font-weight:800;line-height:1;color:var(--tier)}.rank .stars{font-size:24px;font-weight:700}
.track{display:flex;gap:3px;height:16px}.seg{height:100%;background:var(--seg);border-radius:3px;overflow:hidden;position:relative}.seg i{position:absolute;inset:0 auto 0 0;background:var(--c);transition:width .5s}
.labels{display:flex;gap:3px;margin-top:5px;font-size:12px;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:var(--pn);border-radius:10px;padding:8px 10px;text-align:center}.stat b{display:block;font-size:30px;line-height:1.1}.stat span{font-size:13px;color:var(--mu)}
.stat.w b{color:var(--win)}.stat.l b{color:var(--lose)}.stat.r b{color:var(--tier)}
.wrap{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.p{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.p h2{margin:0 0 10px;font-size:15px;color:var(--muted)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.b3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;cursor:pointer;color:#10101c;background:var(--ok)}button:active{transform:scale(.97)}
.bw{background:var(--win)}.bl{background:var(--lose)}.bs{background:#2b2760;color:var(--text)}.bd{background:transparent;color:var(--lose);border:1px solid var(--lose)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}label.c{flex-direction:row;align-items:center;gap:8px}
input,select{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}input[type=color]{padding:2px;height:38px;width:100%}input[type=checkbox]{width:auto}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 0}.err{color:var(--lose)}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top small{color:var(--muted)}.top button{padding:8px 12px;flex:none}
.url{width:100%;font-size:12px}
</style></head><body><div id="app"></div>
<script>
(function(){
var SB="https://etduxjlisobtzdomdjkx.supabase.co",ANON="sb_publishable_W6kFNgyJcy5gt3iZ9POwEA_MU7dvz-P";
var params=new URLSearchParams(location.search),K=(params.get("k")||"").replace(/[^A-Za-z0-9_-]/g,"");
var $=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function api(path,o,tok){o=o||{};o.headers=Object.assign({apikey:ANON,"Content-Type":"application/json"},o.headers||{});if(tok)o.headers.Authorization="Bearer "+tok;return fetch(SB+path,o)}

var D={title:"ROAD TO IMMORTAL",wins:0,losses:0,start:0,winStar:1,loseStar:1,bonus:0,tpl:"gelap",font:"'Segoe UI',system-ui,sans-serif",cBg:"",cText:"",autoAccent:true,cAccent:"#c04bff"};
var TPL={gelap:{bg:"linear-gradient(160deg,#211d4a,#14122b)",ct:"#f3f0ff",mu:"#a49fd0",pn:"#0f0d22",bd:"#3a3570",seg:"#2b2760",r:"14px"},
terang:{bg:"#ffffff",ct:"#1b1b2f",mu:"#6a6a86",pn:"#eef0f7",bd:"#c9cde0",seg:"#dfe2ef",r:"14px"},
kaca:{bg:"rgba(15,13,34,.55)",ct:"#ffffff",mu:"#d0cdf0",pn:"rgba(0,0,0,.35)",bd:"rgba(255,255,255,.25)",seg:"rgba(255,255,255,.18)",r:"18px"},
polos:{bg:"transparent",ct:"#ffffff",mu:"#d0cdf0",pn:"rgba(0,0,0,.45)",bd:"transparent",seg:"rgba(255,255,255,.2)",r:"0"}};
var FONTS=[["Standar","'Segoe UI',system-ui,sans-serif"],["Poppins","Poppins,'Segoe UI',sans-serif"],["Orbitron","Orbitron,'Segoe UI',sans-serif"],["Bebas Neue","'Bebas Neue',Impact,sans-serif"],["Rajdhani","Rajdhani,'Segoe UI',sans-serif"],["Impact","Impact,sans-serif"],["Georgia","Georgia,serif"],["Courier","'Courier New',monospace"]];
var TIERS=[{n:"Mythic",f:0,s:25,c:"#c04bff"},{n:"Honor",f:25,s:25,c:"#ff6a5c"},{n:"Glory",f:50,s:50,c:"#ffb938"},{n:"Immortal",f:100,s:0,c:"#4fe0ff"}];

function card(d){
  var raw=d.start+d.wins*d.winStar-d.losses*d.loseStar+d.bonus,st=Math.max(0,Math.round(raw)),t=TIERS[0];
  TIERS.forEach(function(x){if(st>=x.f)t=x});
  var g=d.wins+d.losses,wr=g?Math.round(d.wins/g*1000)/10:0,tp=TPL[d.tpl]||TPL.gelap;
  var tc=d.autoAccent?t.c:d.cAccent,segs="",lb="";
  TIERS.slice(0,3).forEach(function(x){var f=Math.min(1,Math.max(0,(st-x.f)/x.s))*100;
    segs+='<div class="seg" style="flex:'+x.s+';--c:'+(d.autoAccent?x.c:tc)+'"><i style="width:'+f+'%"></i></div>';lb+='<span style="flex:'+x.s+'">'+x.n+'</span>'});
  var rem=Math.max(0,100-st);
  var v="--bg:"+(d.cBg||tp.bg)+";--ct:"+(d.cText||tp.ct)+";--mu:"+tp.mu+";--pn:"+tp.pn+";--bd:"+tp.bd+";--seg:"+tp.seg+";--r:"+tp.r+";--font:"+d.font+";--tier:"+tc;
  return '<div class="card" style="'+v+'"><div class="head"><div class="title">'+esc(d.title)+'</div><div>'+(rem?"Sisa "+rem+" ★ ke Immortal":"Immortal tercapai!")+'</div></div>'+
  '<div class="rank"><div class="name">'+t.n+'</div><div class="stars">'+(t.s?(st-t.f)+"/"+t.s:"★ "+(st-100))+'</div></div>'+
  '<div class="track">'+segs+'</div><div class="labels">'+lb+'</div><div class="stats"><div class="stat w"><b>'+d.wins+'</b><span>Win</span></div><div class="stat l"><b>'+d.losses+'</b><span>Lose</span></div><div class="stat r"><b>'+wr+'%</b><span>Winrate</span></div></div></div>'}

/* ===== OVERLAY (tanpa login, baca lewat key) ===== */
if(K){
  var cur=D;function draw(){$.innerHTML=card(cur)}draw();
  function pull(){api("/rest/v1/rpc/get_overlay",{method:"POST",body:JSON.stringify({k:K})}).then(function(r){return r.json()}).then(function(d){
    if(d&&d.wins!==undefined){var n=Object.assign({},D,d);if(JSON.stringify(n)!==JSON.stringify(cur)){cur=n;draw()}}}).catch(function(){})}
  pull();setInterval(pull,3000);return;
}

/* ===== DASHBOARD ===== */
document.body.classList.add("dash");
var S=null,okey=null,timer=null;
try{S=JSON.parse(localStorage.getItem("mlbb-sess")||"null")}catch(e){}
function saveSess(){try{localStorage.setItem("mlbb-sess",JSON.stringify(S))}catch(e){}}
function setSess(j){S={at:j.access_token,rt:j.refresh_token,uid:j.user.id,email:j.user.email,exp:Date.now()/1000+(j.expires_in||3600)};saveSess()}
function token(){
  if(S.exp-60>Date.now()/1000)return Promise.resolve(S.at);
  return api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:S.rt})}).then(function(r){return r.json()}).then(function(j){
    if(!j.access_token)throw 0;setSess(j);return S.at})}
function errMsg(j){var m=(j&&(j.error_description||j.msg||j.message))||"Terjadi kesalahan";
  if(/Invalid login/i.test(m))return"Email atau password salah";if(/already/i.test(m))return"Email sudah terdaftar, silakan masuk";if(/at least 6|weak/i.test(m))return"Password minimal 6 karakter";return m}

function authView(msg){
  $.innerHTML='<div class="wrap"><div class="p"><h2>Masuk atau daftar</h2><div class="g" style="grid-template-columns:1fr">'+
  '<label>Email<input id="em" type="email" autocomplete="email"></label><label>Password (minimal 6 karakter)<input id="pw" type="password" autocomplete="current-password"></label></div>'+
  '<div class="row"><button id="bin">Masuk</button><button id="bup" class="bs">Daftar</button></div><p class="hint err" id="msg">'+esc(msg||"")+'</p>'+
  '<p class="hint">Setiap email punya overlay dan datanya sendiri.</p></div></div>';
  function go(path,body,isUp){var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value,m=document.getElementById("msg");
    if(!em||!pw){m.textContent="Isi email dan password";return}m.textContent="Memproses…";
    api(path,{method:"POST",body:JSON.stringify({email:em,password:pw})}).then(function(r){return r.json()}).then(function(j){
      if(j.access_token){setSess(j);start()}else if(isUp&&j.id){m.textContent="Daftar berhasil. Cek email untuk konfirmasi, lalu masuk."}else m.textContent=errMsg(j)}).catch(function(){m.textContent="Gagal terhubung ke server"})}
  document.getElementById("bin").onclick=function(){go("/auth/v1/token?grant_type=password")};
  document.getElementById("bup").onclick=function(){go("/auth/v1/signup",0,true)};
}

function start(){
  $.innerHTML='<div class="wrap"><div class="p">Memuat…</div></div>';
  token().then(function(t){return api("/rest/v1/overlays?select=key,data",{},t).then(function(r){return r.json()}).then(function(rows){
    if(rows&&rows.length){okey=rows[0].key;D=Object.assign({},D,rows[0].data);return}
    return api("/rest/v1/overlays",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({data:D})},t).then(function(r){return r.json()}).then(function(r){okey=r[0].key})})})
  .then(dash).catch(function(){S=null;saveSess();authView("Sesi berakhir, silakan masuk lagi")})}

function queueSave(){clearTimeout(timer);status("Menyimpan…");timer=setTimeout(function(){
  token().then(function(t){return api("/rest/v1/overlays?owner=eq."+S.uid,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({data:D,updated_at:new Date().toISOString()})},t)})
  .then(function(r){status(r.ok?"Tersimpan":"Gagal menyimpan")}).catch(function(){status("Gagal menyimpan")})},500)}
function status(s){var e=document.getElementById("st");if(e)e.textContent=s}

function dash(){
  var link=location.origin+location.pathname+"?k="+okey;
  var num=function(f,l){return'<label>'+l+'<input type="number" step="1" data-f="'+f+'"></label>'};
  $.innerHTML='<div class="wrap"><div class="top"><div><b>Road to Immortal</b><br><small>'+esc(S.email)+' · <span id="st">Tersimpan</span></small></div><button class="bs" id="out">Keluar</button></div>'+
  '<div class="p"><h2>Link overlay untuk OBS / TikTok Studio</h2><input class="url" id="lnk" readonly value="'+esc(link)+'"><div class="row"><button id="cp">Salin link</button></div>'+
  '<p class="hint">Tempel link ini sebagai Browser Source (OBS) atau Add link (TikTok Studio), ukuran sekitar 500 × 330. Key kamu: <b>'+esc(okey)+'</b></p></div>'+
  '<div class="p"><h2>Pratinjau</h2><div id="pv"></div></div>'+
  '<div class="p"><h2>Tambah / kurangi</h2><div class="b3"><button class="bw" data-a="w+">+ Win</button><button class="bl" data-a="l+">+ Lose</button><button class="bs" data-a="w-">− Win</button><button class="bs" data-a="l-">− Lose</button><button class="bs" data-a="b+">+1 ★ bonus</button><button class="bs" data-a="b-">−1 ★ bonus</button></div></div>'+
  '<div class="p"><h2>Edit angka</h2><div class="g">'+num("wins","Win")+num("losses","Lose")+num("start","Bintang awal")+num("bonus","Bonus ★")+num("winStar","★ per Win")+num("loseStar","★ per Lose")+'</div>'+
  '<div class="row"><button class="bd" id="rs">Reset angka</button></div></div>'+
  '<div class="p"><h2>Tema tampilan</h2><div class="g"><label>Judul<input type="text" data-f="title" maxlength="40"></label>'+
  '<label>Template<select data-f="tpl"><option value="gelap">Gelap</option><option value="terang">Terang</option><option value="kaca">Kaca</option><option value="polos">Polos (tanpa kotak)</option></select></label>'+
  '<label>Font<select data-f="font">'+FONTS.map(function(f){return'<option value="'+esc(f[1])+'">'+f[0]+'</option>'}).join("")+'</select></label>'+
  '<label>Warna latar kartu<input type="color" data-f="cBg"></label><label>Warna teks<input type="color" data-f="cText"></label>'+
  '<label>Warna aksen<input type="color" data-f="cAccent"></label></div>'+
  '<label class="c" style="margin-top:10px"><input type="checkbox" data-f="autoAccent"> Warna aksen otomatis mengikuti rank</label>'+
  '<div class="row"><button class="bs" id="rc">Kembalikan warna template</button></div></div></div>';
  var pv=document.getElementById("pv");
  function sync(){pv.innerHTML=card(D);$.querySelectorAll("[data-f]").forEach(function(e){var f=e.getAttribute("data-f"),v=D[f];
    if(e.type==="checkbox")e.checked=!!v;else if(e.type==="color"){var tp=TPL[D.tpl];e.value=v||(f==="cBg"?(tp.bg.charAt(0)==="#"?tp.bg:"#1d1a3d"):f==="cText"?tp.ct:"#c04bff")}else if(document.activeElement!==e)e.value=v})}
  sync();
  $.addEventListener("click",function(e){var a=e.target.getAttribute&&e.target.getAttribute("data-a");if(!a)return;
    if(a==="w+")D.wins++;if(a==="w-")D.wins=Math.max(0,D.wins-1);if(a==="l+")D.losses++;if(a==="l-")D.losses=Math.max(0,D.losses-1);if(a==="b+")D.bonus++;if(a==="b-")D.bonus--;sync();queueSave()});
  $.addEventListener("input",function(e){var f=e.target.getAttribute&&e.target.getAttribute("data-f");if(!f)return;var el=e.target;
    if(el.type==="checkbox")D[f]=el.checked;else if(el.type==="number"){var n=parseInt(el.value,10);if(isNaN(n))return;D[f]=(f==="wins"||f==="losses"||f==="start")?Math.max(0,n):n}else D[f]=el.value;
    if(f==="tpl"){D.cBg="";D.cText=""}sync();queueSave()});
  document.getElementById("rc").onclick=function(){D.cBg="";D.cText="";D.autoAccent=true;sync();queueSave()};
  document.getElementById("rs").onclick=function(){if(confirm("Reset win, lose, bintang awal dan bonus ke 0?")){D.wins=D.losses=D.start=D.bonus=0;sync();queueSave()}};
  document.getElementById("cp").onclick=function(){var i=document.getElementById("lnk");i.select();try{navigator.clipboard.writeText(i.value)}catch(x){document.execCommand("copy")}status("Link disalin")};
  document.getElementById("out").onclick=function(){S=null;saveSess();authView()};
}
if(S&&S.rt)start();else authView();
})();
</script></body></html>
