<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road to Immortal – Overlay MLBB</title>
<style>
  :root{
    --ink:#14122b; --panel:#1d1a3d; --line:#3a3570; --text:#f3f0ff; --muted:#a49fd0;
    --mythic:#c04bff; --honor:#ff6a5c; --glory:#ffb938; --immortal:#4fe0ff;
    --win:#4ade80; --lose:#ff5d73;
    font-family:"Bahnschift","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--text)}
  body.green{background:#00ff00}
  body.control{background:#0f0d22;padding:16px}

  /* ===== OVERLAY ===== */
  .card{width:460px;max-width:100%;background:linear-gradient(160deg,#211d4a,#14122b);border:2px solid var(--line);border-radius:14px;padding:16px 18px 14px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--tier,var(--mythic))}
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .title{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
  .remain{font-size:14px;color:var(--muted)}
  .rank{display:flex;align-items:baseline;gap:12px;margin:6px 0 12px}
  .rank .name{font-size:40px;font-weight:800;line-height:1;color:var(--tier,var(--mythic))}
  .rank .stars{font-size:24px;font-weight:700}
  .track{position:relative;display:flex;gap:3px;height:16px}
  .seg{height:100%;background:#2b2760;border-radius:3px;position:relative;overflow:hidden}
  .seg i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);transition:width .5s ease}
  .labels{display:flex;gap:3px;margin-top:5px;font-size:12px;color:var(--muted)}
  .labels span{text-align:left}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:#0f0d22;border-radius:10px;padding:8px 10px;text-align:center}
  .stat b{display:block;font-size:30px;line-height:1.1}
  .stat span{font-size:13px;color:var(--muted)}
  .stat.w b{color:var(--win)} .stat.l b{color:var(--lose)} .stat.r b{color:var(--tier,var(--text))}

  /* ===== PANEL ===== */
  .wrap{display:flex;flex-direction:column;gap:16px;max-width:520px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .panel h2{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;cursor:pointer;color:#10101c;transition:transform .08s}
  button:active{transform:scale(.97)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--immortal);outline-offset:2px}
  .bw{background:var(--win)} .bl{background:var(--lose)}
  .bs{background:#2b2760;color:var(--text)}
  .bd{background:transparent;color:var(--lose);border:1px solid var(--lose)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  input[type=number],input[type=text]{font:inherit;color:var(--text);background:#0f0d22;border:1px solid var(--line);border-radius:8px;padding:8px}
  .hint{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 0}
  .row{margin-top:10px}
  @media (prefers-reduced-motion:reduce){.seg i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var KEY = "mlbb-road-state-v1";
  var params = new URLSearchParams(location.search);
  var view = params.get("view") === "control" ? "control" : "overlay";
  if (params.get("bg") === "green") document.body.classList.add("green");
  if (view === "control") document.body.classList.add("control");

  var defaults = { title:"ROAD TO IMMORTAL", wins:0, losses:0, start:0, winStar:1, loseStar:1, bonus:0 };
  var state = load();
  var ch = null;
  try { ch = new BroadcastChannel("mlbb-road"); ch.onmessage = function(){ state = load(); render(); }; } catch(e){}
  window.addEventListener("storage", function(e){ if(e.key === KEY){ state = load(); render(); } });

  function load(){
    try { var r = localStorage.getItem(KEY); if(r) return Object.assign({}, defaults, JSON.parse(r)); } catch(e){}
    return Object.assign({}, defaults);
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
    try { if(ch) ch.postMessage("update"); } catch(e){}
    render();
  }

  // 4 tingkat: Mythic 25, Honor 25, Glory 50, Immortal (100 bintang total)
  var TIERS = [
    { name:"Mythic",   from:0,   size:25, c:"var(--mythic)" },
    { name:"Honor",    from:25,  size:25, c:"var(--honor)" },
    { name:"Glory",    from:50,  size:50, c:"var(--glory)" },
    { name:"Immortal", from:100, size:0,  c:"var(--immortal)" }
  ];
  var TOTAL = 100;

  function calc(){
    var raw = state.start + state.wins*state.winStar - state.losses*state.loseStar + state.bonus;
    var stars = Math.max(0, Math.round(raw));
    var t = TIERS[0];
    for (var i = 0; i < TIERS.length; i++) if (stars >= TIERS[i].from) t = TIERS[i];
    var games = state.wins + state.losses;
    return {
      stars: stars, tier: t,
      inTier: t.size ? (stars - t.from) + "/" + t.size : "★ " + (stars - 100),
      remain: Math.max(0, TOTAL - stars),
      wr: games ? Math.round(state.wins / games * 1000) / 10 : 0
    };
  }

  function overlayHTML(){
    var c = calc(), segs = "", lbls = "";
    TIERS.slice(0,3).forEach(function(t){
      var fill = Math.min(1, Math.max(0, (c.stars - t.from) / t.size)) * 100;
      segs += '<div class="seg" style="flex:' + t.size + ';--c:' + t.c + '"><i style="width:' + fill + '%"></i></div>';
      lbls += '<span style="flex:' + t.size + '">' + t.name + '</span>';
    });
    var remainTxt = c.remain > 0 ? "Sisa " + c.remain + " ★ ke Immortal" : "Immortal tercapai!";
    return '<div class="card" style="--tier:' + c.tier.c + '">' +
      '<div class="head"><div class="title">' + esc(state.title) + '</div><div class="remain">' + remainTxt + '</div></div>' +
      '<div class="rank"><div class="name">' + c.tier.name + '</div><div class="stars">' + c.inTier + '</div></div>' +
      '<div class="track">' + segs + '</div><div class="labels">' + lbls + '</div>' +
      '<div class="stats">' +
        '<div class="stat w"><b>' + state.wins + '</b><span>Win</span></div>' +
        '<div class="stat l"><b>' + state.losses + '</b><span>Lose</span></div>' +
        '<div class="stat r"><b>' + c.wr + '%</b><span>Winrate</span></div>' +
      '</div></div>';
  }

  function controlHTML(){
    return '<div class="wrap">' +
      '<div class="panel"><h2>Tambah / kurangi</h2><div class="btns">' +
        '<button class="bw" data-a="w+">+ Win (W)</button><button class="bl" data-a="l+">+ Lose (L)</button>' +
        '<button class="bs" data-a="w-">− Win</button><button class="bs" data-a="l-">− Lose</button>' +
        '<button class="bs" data-a="b+">+ 1 ★ bonus</button><button class="bs" data-a="b-">− 1 ★ bonus</button>' +
      '</div><p class="hint">Bonus ★ dipakai untuk bintang ekstra (misal win streak) atau koreksi cepat. Pintasan keyboard: W = +Win, L = +Lose.</p></div>' +
      '<div class="panel"><h2>Edit manual</h2><div class="fields">' +
        field("wins","Win") + field("losses","Lose") +
        field("start","Bintang awal (dari Mythic 0)") + field("bonus","Bonus ★") +
        field("winStar","★ per Win") + field("loseStar","★ per Lose") +
      '</div><label class="row">Judul overlay<input type="text" id="f-title" value="' + esc(state.title) + '"></label>' +
      '<div class="row"><button class="bd" data-a="reset">Reset semua</button></div></div>' +
      '<div class="panel"><h2>Pratinjau</h2>' + overlayHTML() + '</div></div>';
  }
  function field(k, label){
    return '<label>' + label + '<input type="number" step="1" id="f-' + k + '" value="' + state[k] + '"></label>';
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }

  var app = document.getElementById("app");
  function render(){
    var focusId = document.activeElement && document.activeElement.id;
    app.innerHTML = view === "control" ? controlHTML() : overlayHTML();
    if (view === "control" && focusId){ var el = document.getElementById(focusId); if(el && el.type !== "text") el.focus(); }
  }

  if (view === "control"){
    app.addEventListener("click", function(e){
      var a = e.target.getAttribute && e.target.getAttribute("data-a"); if(!a) return;
      if (a === "w+") state.wins++;
      if (a === "w-") state.wins = Math.max(0, state.wins - 1);
      if (a === "l+") state.losses++;
      if (a === "l-") state.losses = Math.max(0, state.losses - 1);
      if (a === "b+") state.bonus++;
      if (a === "b-") state.bonus--;
      if (a === "reset" && confirm("Reset win, lose, dan bintang ke 0?")) state = Object.assign({}, defaults, { title: state.title });
      save();
    });
    app.addEventListener("change", function(e){
      var id = e.target.id || ""; if (id.indexOf("f-") !== 0) return;
      var k = id.slice(2);
      if (k === "title") state.title = e.target.value;
      else {
        var n = parseInt(e.target.value, 10); if (isNaN(n)) n = defaults[k];
        if (k === "wins" || k === "losses" || k === "start" ) n = Math.max(0, n);
        state[k] = n;
      }
      save();
    });
    window.addEventListener("keydown", function(e){
      var t = e.target.tagName; if (t === "INPUT") return;
      if (e.key === "w" || e.key === "W"){ state.wins++; save(); }
      if (e.key === "l" || e.key === "L"){ state.losses++; save(); }
    });
  }
  render();
})();
</script>
</body>
</html>
