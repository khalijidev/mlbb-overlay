<style>
:root{--ink:#0f0d22;--panel:#1d1a3d;--line:#3a3570;--text:#f3f0ff;--muted:#a49fd0;--win:#4ade80;--lose:#ff5d73;--ok:#4fe0ff;font-family:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text)}
body.dash{background:var(--ink);padding:16px}
body.ov{overflow:hidden;height:100vh}
.card{width:var(--w,460px);max-width:100%;background:var(--bg);color:var(--ct);border:2px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px 14px;position:relative;overflow:hidden;font-family:var(--font)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--tier)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--mu)}.title{font-weight:700;font-size:15px;letter-spacing:.04em}
.rank{display:flex;align-items:center;gap:14px;margin:8px 0 12px}.card .name{font-size:40px;font-weight:800;line-height:1;color:var(--tier)}.card .stars{font-size:24px;font-weight:700;margin-top:4px}.card img{width:auto;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.ring{display:flex;align-items:center;gap:16px;margin-top:6px}.ring .mid{flex:1;min-width:0}.ring .head>*{white-space:nowrap}.ring .sm{width:236px;flex:none}.ring .sm .stats{margin:0}.ring .sm .stat b{font-size:22px}
.rk{display:flex;align-items:baseline;gap:12px;margin:6px 0 10px}.rk .stars{font-size:24px;font-weight:700;margin:0}
.ctr{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:12px;text-align:center}.ctr .stars{margin:0}
.rm{text-align:center;font-size:13px;color:var(--mu);margin-top:8px}
.big{display:flex;align-items:center;gap:18px;margin:8px 0 12px}.big .bm{flex:1;min-width:0}.big .rm2{font-size:13px;color:var(--mu);margin-top:6px}
.mini{display:flex;align-items:center;gap:10px;margin:4px 0 10px}.mini .name{font-size:30px}.mini .stars{font-size:20px;font-weight:700;margin:0}.mini .sp{flex:1}.mini .title{font-size:12px;color:var(--mu);white-space:nowrap}
.track.thin{height:10px}.line{display:flex;justify-content:space-between;margin-top:10px;font-weight:800;font-size:17px}
.line .w{color:var(--win)}.line .l{color:var(--lose)}.line .r{color:var(--tier)}
.dc{display:block;text-align:center;text-decoration:none;background:#5865f2;color:#fff;font-weight:700;border-radius:10px;padding:12px}.dc:hover{filter:brightness(1.1)}
.track{display:flex;gap:3px;height:16px}.seg{height:100%;background:var(--seg);border-radius:3px;overflow:hidden;position:relative}.seg i{position:absolute;inset:0 auto 0 0;background:var(--c);transition:width .5s}
.labels{display:flex;gap:3px;margin-top:5px;font-size:12px;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:var(--pn);border-radius:10px;padding:8px 10px;text-align:center}.stat b{display:block;font-size:30px;line-height:1.1}.stat span{font-size:13px;color:var(--mu)}
.stat.w b{color:var(--win)}.stat.l b{color:var(--lose)}.stat.r b{color:var(--tier)}
.vip{margin-top:12px;background:var(--pn);border-radius:10px;padding:8px 12px 6px}
.vip .vh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--tier);margin-bottom:4px}
.vip .vh span+span{font-size:12px;font-weight:600;color:var(--mu);letter-spacing:0}
.vr{display:flex;align-items:center;gap:10px;padding:5px 0}.vr+.vr{border-top:1px solid rgba(128,128,128,.25)}
.vr .no{width:18px;font-weight:800;color:var(--tier);text-align:center}
.vr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:16px}
.vr .nm small{color:var(--mu);font-weight:600;margin-left:6px;font-size:12px}
.vr .mc{font-weight:800;font-size:15px;white-space:nowrap}
.wrap{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.p{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.p h2{margin:0 0 10px;font-size:15px;color:var(--muted)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.b3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;cursor:pointer;color:#10101c;background:var(--ok)}button:active{transform:scale(.97)}
.bw{background:var(--win)}.bl{background:var(--lose)}.bs{background:#2b2760;color:var(--text)}.bd{background:transparent;color:var(--lose);border:1px solid var(--lose)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}label.c{flex-direction:row;align-items:center;gap:8px}
input,select{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}input[type=color]{padding:2px;height:38px;width:100%}input[type=checkbox]{width:auto}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 0}.err{color:var(--lose)}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top small{color:var(--muted)}.top button{padding:8px 12px;flex:none}
.url{width:100%;font-size:12px}
.pwrow{display:flex;gap:8px}.pwrow input{flex:1;min-width:0}.pwrow button{flex:none;padding:8px 14px;font-size:13px}
.vi{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}.vi .t{flex:1;min-width:0;font-size:14px;line-height:1.35}.vi .t b{overflow-wrap:anywhere}.vi small{color:var(--muted);font-size:12px}
.vi button{padding:6px 10px;font-size:13px;flex:none}

var LAYOUTS=[["klasik","Klasik",460],["ringkas","Strip lebar",760],["tengah","Tengah (vertikal)",340],["besar","Lencana besar",520],["minimal","Minimal",420]];

/* ===== VIP MABAR: urut match terbanyak di atas, overlay tampil maksimal 5 ===== */
var VIP_MAX=5;
function vipSorted(d){return (Array.isArray(d.vip)?d.vip:[]).map(function(e,i){return{e:e,i:i}}).filter(function(x){return x.e&&x.e.m>0}).sort(function(a,b){return b.e.m-a.e.m||a.i-b.i})}
function vipHtml(d){
  if(d.showVip===false||d.layout!=="ringkas")return"";
  var all=vipSorted(d);if(!all.length)return"";
  var l=all.slice(0,VIP_MAX),more=all.length>VIP_MAX?"+"+(all.length-VIP_MAX)+" lagi":"";
  return '<div class="vip"><div class="vh"><span>★ ANTRIAN MABAR VIP</span><span>'+more+'</span></div>'+
    l.map(function(x,k){return'<div class="vr"><span class="no">'+(k+1)+'</span><span class="nm">'+esc(x.e.n)+(x.e.u?'<small>ID '+esc(x.e.u)+'</small>':'')+'</span><span class="mc">'+x.e.m+' match</span></div>'}).join("")+'</div>'}

function card(d){
  var st=starsOf(d),t=TIERS[0];TIERS.forEach(function(x){if(st>=x.f)t=x});
  var g=d.wins+d.losses,wr=g?Math.round(d.wins/g*1000)/10:0,tp=TPL[d.tpl]||TPL.gelap;
  var tcol=function(x){return tp.lt?x.cd:x.c},tc=d.autoAccent?tcol(t):d.cAccent,segs="",lb="";
  var L=LAYOUTS.filter(function(x){return x[0]===d.layout})[0]||LAYOUTS[0];
  TIERS.forEach(function(x){var sz=x.s||20,f=x.s?Math.min(1,Math.max(0,(st-x.f)/x.s))*100:(st>=100?100:0);
    segs+='<div class="seg" style="flex:'+sz+';--c:'+(d.autoAccent?tcol(x):tc)+'"><i style="width:'+f+'%"></i></div>';lb+='<span style="flex:'+sz+'">'+x.n+'</span>'});
  var rem=Math.max(0,100-st),remT=rem?"Sisa "+rem+" ★ ke Immortal":"Immortal tercapai!",stT=t.s?(st-t.f)+"/"+t.s:"★ "+(st-100);
  var bi=function(h){return d.showBadge!==false?'<img alt="" style="height:'+h+'px" src="'+IMG[t.n]+'">':''};
  var track='<div class="track">'+segs+'</div>',labels='<div class="labels">'+lb+'</div>';
  var stats='<div class="stats"><div class="stat w"><b>'+d.wins+'</b><span>Win</span></div><div class="stat l"><b>'+d.losses+'</b><span>Lose</span></div><div class="stat r"><b>'+wr+'%</b><span>Winrate</span></div></div>';
  var title='<div class="title">'+esc(d.title)+'</div>',nm='<div class="name">'+t.n+'</div>',sr='<div class="stars">'+stT+'</div>',head='<div class="head">'+title+'<div>'+remT+'</div></div>',body;
  if(L[0]==="ringkas")body='<div class="ring">'+bi(96)+'<div class="mid">'+head+'<div class="rk">'+nm+sr+'</div>'+track+labels+'</div><div class="sm">'+stats+'</div></div>';
  else if(L[0]==="tengah")body='<div class="ctr">'+title+bi(120)+nm+sr+'</div>'+track+labels+'<div class="rm">'+remT+'</div>'+stats;
  else if(L[0]==="besar")body='<div class="big">'+bi(150)+'<div class="bm">'+title+'<div class="rk">'+nm+sr+'</div>'+track+labels+'<div class="rm2">'+remT+'</div></div></div>'+stats;
  else if(L[0]==="minimal")body='<div class="mini">'+bi(52)+nm+sr+'<div class="sp"></div>'+title+'</div><div class="track thin">'+segs+'</div><div class="line"><span class="w">Win '+d.wins+'</span><span class="l">Lose '+d.losses+'</span><span class="r">WR '+wr+'%</span></div>';
  else body=head+'<div class="rank">'+bi(92)+'<div>'+nm+sr+'</div></div>'+track+labels+stats;
  body+=vipHtml(d);
  var v="--bg:"+(d.cBg||tp.bg)+";--ct:"+(d.cText||tp.ct)+";--mu:"+tp.mu+";--pn:"+tp.pn+";--bd:"+tp.bd+";--seg:"+tp.seg+";--r:"+tp.r+";--font:"+d.font+";--sh:"+(tp.sh||"none")+";--win:"+(tp.lt?"#15a34a":"#4ade80")+";--lose:"+(tp.lt?"#e11d48":"#ff5d73")+";--tier:"+tc+";--w:"+L[2]+"px";
  return '<div class="card" data-w="'+L[2]+'" style="'+v+'">'+body+'</div>'}

    var vp=c.querySelector(".vip"),h=c.offsetHeight-(vp?vp.offsetHeight+12:0),vw=window.innerWidth,vh=window.innerHeight;if(!vw||!vh||!h)return;

var S=null,okey=null,timer=null;
try{S=JSON.parse(localStorage.getItem("mlbb-sess")||"null")}catch(e){}
function saveSess(){try{localStorage.setItem("mlbb-sess",JSON.stringify(S))}catch(e){}}
function setSess(j){S={at:j.access_token,rt:j.refresh_token,uid:j.user.id,email:j.user.email,exp:Date.now()/1000+(j.expires_in||3600)};saveSess()}
function token(){
  if(S.exp-60>Date.now()/1000)return Promise.resolve(S.at);
  return api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:S.rt})}).then(function(r){return r.json()}).then(function(j){
    if(!j.access_token)throw 0;setSess(j);return S.at})}
function errMsg(j){var m=(j&&(j.error_description||j.msg||j.message))||"Terjadi kesalahan";
  if(/Invalid login/i.test(m))return"Email atau password salah";if(/already/i.test(m))return"Email sudah terdaftar, silakan masuk";if(/at least 6|weak/i.test(m))return"Password minimal 6 karakter";return m}

    return api("/rest/v1/overlays",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({data:D})},t).then(function(r){return r.json()}).then(function(r){okey=r[0].key})})})
